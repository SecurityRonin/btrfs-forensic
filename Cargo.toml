[workspace]
resolver = "2"
members = ["core", "forensic"]

# Single source of truth for fields shared (identical) by every member (DRY).
# `version` is NOT hoisted: core and forensic are versioned independently, so
# each keeps its own `version` inline.
#
# `rust-version` is the CI-verified MSRV floor. It is NOT the usual fleet library
# floor (1.75/1.80): the batteries-included pure-Rust zstd decoder (`ruzstd 0.8`)
# declares `rust-version = 1.87`, so that decoder — not our own code — dictates
# the floor. Per the Batteries-Included policy ("MSRV yields to capability") we
# keep the always-compiled zstd path and take the 1.87 floor rather than
# feature-gate the decoder to advertise a lower one. Verified by the `msrv` CI job.
[workspace.package]
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/SecurityRonin/btrfs-forensic"
homepage = "https://github.com/SecurityRonin/btrfs-forensic"
authors = ["Albert Hui <albert@securityronin.com>"]
categories = ["parser-implementations", "filesystem"]
readme = "README.md"

# Single source of truth for dependency versions (DRY): declare each once;
# members write `dep.workspace = true`. The inter-crate `btrfs-core` version
# lives here too, so a bump touches one line instead of every member.
[workspace.dependencies]
btrfs-core = { path = "core", version = "0.1.0" }
forensicnomicon = "1"
thiserror = "2"
# CRC32c (Castagnoli / iSCSI polynomial) — btrfs default checksum.
crc = "3"
# Extent decompression — batteries-included (compiled in, never feature-gated).
# zlib: flate2 with the pure-Rust miniz_oxide backend (no C toolchain).
flate2 = "1"
# zstd: ruzstd, a pure-Rust decoder (no C FFI; keeps the tree unsafe-free).
ruzstd = "0.8"
# LZO1X: a safe, dependency-free, bounds-checked pure-Rust decompressor; btrfs's
# per-sector framing is applied on top in extent.rs.
lzo = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all                      = { level = "warn", priority = -1 }
pedantic                 = { level = "warn", priority = -1 }
correctness              = { level = "deny", priority = -1 }
suspicious               = { level = "deny", priority = -1 }
unwrap_used              = { level = "deny", priority = 0 }
expect_used              = { level = "deny", priority = 0 }
module_name_repetitions  = { level = "allow", priority = 1 }
must_use_candidate       = { level = "allow", priority = 1 }
missing_errors_doc       = { level = "allow", priority = 1 }
missing_panics_doc       = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap       = { level = "allow", priority = 1 }
cast_sign_loss           = { level = "allow", priority = 1 }
cast_precision_loss      = { level = "allow", priority = 1 }
too_many_lines           = { level = "allow", priority = 1 }
items_after_statements   = { level = "allow", priority = 1 }
similar_names            = { level = "allow", priority = 1 }
manual_let_else          = { level = "allow", priority = 1 }
