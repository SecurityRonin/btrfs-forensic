[package]
name = "btrfs-core"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust from-scratch btrfs filesystem reader — superblock, chunk-tree logical→physical mapping, B-tree navigation, over any byte source"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/btrfs-core"
readme.workspace = true
authors.workspace = true
keywords = ["forensics", "btrfs", "filesystem", "dfir", "parser"]
categories.workspace = true
# Integration tests live under /tests and read fixtures from the repo-root
# tests/data via env-gated paths, outside this package. They are repo-CI
# artifacts, not consumer-facing — excluding them keeps the published tarball
# self-contained.
exclude = ["/fuzz", "/.github", "/docs", "/tests"]

# The bare `btrfs` crate name on crates.io is a maintained third-party ioctl
# wrapper (`btrfs` 1.2.2, "Interface for BTRFS ioctls etc"). We do NOT hijack
# that import path; consumers use `btrfs_core` so our on-disk reader is never
# confused with the live-FS ioctl crate. Hence no `[lib] name` override.

[features]
default = []
# forensic-vfs FileSystem contract (optional): mount a btrfs image as a
# node-addressed read-only filesystem. Behind the `vfs` feature so the bare
# parser does not inherit the VFS dependency graph (ADR 0004).
vfs = ["dep:forensic-vfs"]

[dependencies]
thiserror = { workspace = true }
# CRC32c verification of the superblock (btrfs default checksum).
crc = { workspace = true }
# Extent decompression (batteries-included: always compiled in — an examiner
# must decode compressed content from the zero-config path, no feature flag).
flate2 = { workspace = true }
ruzstd = { workspace = true }
lzo = { workspace = true }
forensic-vfs = { version = "0.5", optional = true }
