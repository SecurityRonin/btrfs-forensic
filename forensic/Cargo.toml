[package]
name = "btrfs-forensic"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Forensic anomaly auditor for btrfs — CoW stale-root / generation-inconsistency / csum-mismatch recovery as graded report::Finding, built on btrfs-core"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/btrfs-forensic"
readme.workspace = true
authors.workspace = true
keywords = ["forensics", "btrfs", "dfir", "carving", "anti-forensics"]
categories.workspace = true
# Integration tests read their oracle images from the repo-root tests/data via
# env-gated paths (outside this package); they are repo-CI artifacts, not
# consumer-facing. Excluding them keeps the published tarball to just src/.
exclude = ["/fuzz", "/.github", "/docs", "/tests"]

[dependencies]
btrfs-core = { workspace = true }
# btrfs structure knowledge + the shared report model (Severity/Observation).
forensicnomicon = { workspace = true }

[lints]
workspace = true
